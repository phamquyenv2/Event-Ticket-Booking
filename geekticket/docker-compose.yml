services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-geekticketdb}
      POSTGRES_USER: ${DB_USERNAME:-geekticket}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-geekticket} -d ${DB_NAME:-geekticketdb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-geekticket}
      DB_USERNAME: ${DB_USERNAME:-geekticket}
      DB_PASSWORD: ${DB_PASSWORD:-geekticket}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  postgres_data:
